let checkedFoods = JSON.parse(localStorage.getItem('jiangsuFoodChecked') || '[]');
function updateCheckinCount() { document.getElementById('checkin-count').textContent = checkedFoods.length; }
function toggleCheckin(foodKey, btn) { event.stopPropagation(); var idx = checkedFoods.indexOf(foodKey); if (idx > -1) { checkedFoods.splice(idx, 1); btn.classList.remove('checked'); btn.textContent = '打卡'; } else { checkedFoods.push(foodKey); btn.classList.add('checked'); btn.textContent = '已打卡'; } localStorage.setItem('jiangsuFoodChecked', JSON.stringify(checkedFoods)); updateCheckinCount(); }

function renderFoodData() {
    var container = document.getElementById('food-content');
    container.innerHTML = '';
    
    Object.entries(foodData).forEach(function(entry) {
        var cityKey = entry[0];
        var cityData = entry[1];
        var citySection = document.createElement('section');
        citySection.className = 'city-section city-' + cityKey;
        citySection.setAttribute('data-city', cityKey);
        
        var header = document.createElement('div');
        header.className = 'city-header';
        header.innerHTML = '<span class="city-icon">' + cityData.icon + '</span><div><h2>' + cityData.name + '</h2><div class="city-desc">' + cityData.desc + '</div></div>';
        citySection.appendChild(header);
        
        Object.entries(cityData.districts).forEach(function(de) {
            var districtName = de[0];
            var foods = de[1];
            if (!foods || foods.length === 0) return;
            
            var districtDiv = document.createElement('div');
            districtDiv.className = 'district-section';
            
            var districtTitle = document.createElement('div');
            districtTitle.className = 'district-title';
            districtTitle.innerHTML = '<span class="district-icon"><svg viewBox="0 0 24 24"><path d="M3,9 L12,3 L21,9 M3,9 L12,15 L21,9 M12,15 L12,21"/></svg></span><span>' + districtName + '</span>';
            districtDiv.appendChild(districtTitle);
            
            var foodGrid = document.createElement('div');
            foodGrid.className = 'food-grid';
            
            foods.forEach(function(food) {
                var foodKey = cityKey + '-' + districtName + '-' + food.name;
                var card = document.createElement('div');
                card.className = 'food-card';
                card.dataset.foodKey = foodKey;
                card.onclick = function() { openModal(food, cityData.name, districtName); };
                
                var tags = food.tags.slice(0, 2).map(function(tag) {
                    var tagClass = 'food-tag';
                    if (tag.includes('非遗') || tag.includes('地理标志') || tag.includes('老字号')) tagClass += ' heritage';
                    else if (tag.includes('时令') || tag.includes('季节')) tagClass += ' seasonal';
                    else if (tag.includes('小吃') || tag.includes('街头')) tagClass += ' snack';
                    return '<span class="' + tagClass + '">' + tag + '</span>';
                }).join('');
                
                card.innerHTML = '<div class="food-card-header"><div class="food-name">' + food.name + '</div><div class="food-tags">' + tags + '</div></div><div class="food-card-body"><div class="food-brief">' + (food.brief || '') + '</div><div class="food-footer"><button class="checkin-btn" onclick="toggleCheckin(\'' + foodKey.replace(/'/g, "\\'") + '\', this)">打卡</button><span class="food-detail-btn">详情</span></div></div>';
                
                foodGrid.appendChild(card);
            });
            
            districtDiv.appendChild(foodGrid);
            citySection.appendChild(districtDiv);
        });
        
        container.appendChild(citySection);
    });
    
    updateCheckinCount();
    setupScrollAnimation();
    updateCheckinButtons();
}

function setupScrollAnimation() {
    var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
            if (entry.isIntersecting) entry.target.classList.add('visible');
        });
    }, { threshold: 0.1 });
    
    document.querySelectorAll('.city-section, .food-card').forEach(function(el) { observer.observe(el); });
}

function updateCheckinButtons() {
    document.querySelectorAll('.food-card').forEach(function(card) {
        var foodKey = card.dataset.foodKey;
        var btn = card.querySelector('.checkin-btn');
        if (checkedFoods.includes(foodKey)) { btn.classList.add('checked'); btn.textContent = '已打卡'; }
    });
}

function openModal(food, cityName, districtName) {
    document.getElementById('modal-title').textContent = food.name;
    document.getElementById('modal-location').textContent = cityName + ' · ' + districtName;
    document.getElementById('modal-desc').innerHTML = formatContent(food.desc || '');
    
    var storySection = document.getElementById('story-section');
    var storyContent = document.getElementById('modal-story');
    if (food.story) { storySection.classList.remove('hidden'); storyContent.innerHTML = formatContent(food.story); }
    else { storySection.classList.add('hidden'); }
    
    var compareSection = document.getElementById('compare-section');
    var compareContent = document.getElementById('modal-compare');
    if (food.compare) { compareSection.style.display = 'block'; compareContent.innerHTML = formatContent(food.compare); }
    else { compareSection.style.display = 'none'; }
    
    var shopSection = document.getElementById('shop-section');
    var shopContent = document.getElementById('modal-shop');
    if (food.shop) { shopSection.classList.remove('hidden'); shopContent.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B5A2B" stroke-width="2" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><span><strong>📍 推荐地点：</strong>' + food.shop + '</span>'; }
    else { shopSection.classList.add('hidden'); }
    
    document.getElementById('modal').classList.add('show');
    document.body.style.overflow = 'hidden';
}

function formatContent(text) {
    if (!text) return '';
    return text.split('<br>').filter(function(t) { return t.trim(); }).map(function(t) { return '<p>' + t.replace(/【([^】]+)】/g, '<strong>$1</strong>：') + '</p>'; }).join('');
}

function closeModal() { document.getElementById('modal').classList.remove('show'); document.body.style.overflow = ''; }
document.getElementById('modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

document.querySelectorAll('.nav-list button').forEach(function(btn) {
    btn.addEventListener('click', function() {
        var city = this.getAttribute('data-city');
        document.querySelectorAll('.nav-list button').forEach(function(b) { b.classList.remove('active'); });
        this.classList.add('active');
        
        document.querySelectorAll('.city-section').forEach(function(section) {
            var sectionCity = section.getAttribute('data-city');
            if (city === 'all') section.classList.remove('hidden');
            else section.classList.toggle('hidden', sectionCity !== city);
        });
        
        if (city === 'all') window.scrollTo({ top: 0, behavior: 'smooth' });
        else {
            var targetSection = document.querySelector('.city-section[data-city="' + city + '"]');
            if (targetSection) {
                var navHeight = document.querySelector('.nav-bar').offsetHeight;
                var targetTop = targetSection.getBoundingClientRect().top + window.pageYOffset - navHeight - 20;
                window.scrollTo({ top: targetTop, behavior: 'smooth' });
            }
        }
    });
});

(function() {
    try {
        if (typeof foodData === 'undefined') throw new Error('foodData未定义');
        renderFoodData();
    } catch (e) {
        console.error('网站初始化错误:', e);
        document.getElementById('food-content').innerHTML = '<div style="padding:40px;text-align:center;color:#C41E3A;"><h2>数据加载出错</h2><p>请刷新页面重试。</p></div>';
    }
})();
</script>
