/* ==================== 导航栏 ==================== */

.city-changzhou .city-header { background: linear-gradient(135deg, #2d5a27 0%, #4a7c44 100%); }
.city-suzhou .city-header { background: linear-gradient(135deg, #1e4d2b 0%, #2d5a27 100%); }
.city-nantong .city-header { background: linear-gradient(135deg, #0066a1 0%, #0088cc 100%); }
.city-lianyungang .city-header { background: linear-gradient(135deg, #4a148c 0%, #7b1fa2 100%); }

.food-grid {

}

.food-card {

}

.modal-overlay {

/* ==================== 统计信息 ==================== */
.stats-bar {

/* ==================== 页脚 ==================== */
.footer {

.footer .copyright { font-size: 0.8rem; opacity: 0.6; }

/* ==================== 响应式 ==================== */
@media (max-width: 768px) {
    .hero h1 { font-size: 2.5rem; }

}
@media (max-width: 480px) {
    .hero h1 { font-size: 2rem; }
    .hero { padding: 50px 15px 40px; }

/* ==================== 动画 ==================== */
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }

}

进区": [{"name": "焦溪二花脸肉圆", "tags": ["武进名菜", "非遗"], "brief": "手工制作，肥而不腻", "desc": "二花脸猪是常州焦溪特产，肉质细腻。肉圆选用五花肉，手工打至上劲，蒸制而成。", "story": "焦溪二花脸猪是400年前的传统猪种，因额头皱纹似'二'字而得名。2014年被列入国家级畜禽遗传资源保护名录。用二花脸猪肉做成的肉圆，肥而不腻，口感细腻，是常州宴席上的必备菜。", "shop": "焦溪古镇农家乐（常州市武进区焦溪镇中街68号）", "compare": "【猪种】二花脸猪是400年前传统猪种<br>【工艺】手工打至上劲，蒸制而成<br>【特点】肥而不腻，口感细腻"}], "金坛区": [{"name": "金坛标米封缸酒", "tags": ["金坛特产", "非遗"], "brief": "糯米酿制，醇厚甘甜", "desc": "封缸酒选用金坛优质糯米，经传统工艺自然发酵，色泽琥珀，醇厚甘甜。", "story": "金坛封缸酒始于秦代，相传秦始皇东巡时曾品尝此酒，赞其'琼浆玉液'。选用金坛特有的'标米'（早白粳）酿制，需封缸发酵三年以上方可开坛，故名'封缸酒'。", "shop": "金坛封缸酒厂直销店（常州市金坛区东门大街188号）", "compare": "【选料】金坛特有标米（早白粳）<br>【工艺】封缸发酵三年以上<br>【历史】始于秦代，曾为贡品"}], "溧阳市": [{"name": "天目湖砂锅鱼头", "tags": ["溧阳名片", "必吃"], "brief": "汤白如乳，鲜而不腥", "desc": "天目湖砂锅鱼头选用天目湖中天然生长的鳙鱼头，用天目湖水文火久煨，汤色乳白如汁、口感鲜而不腥。", "story": "天目湖砂锅鱼头是溧阳的招牌菜，1970年代由天目湖宾馆厨师朱顺才创制。著名数学家华罗庚曾多次回乡品尝，赞不绝口。选用5-8斤重的野生鳙鱼头，用文火慢炖3小时以上，汤汁如牛奶般丝滑。", "shop": "天目湖宾馆（常州市溧阳市天目湖旅游度假区环湖西路1号）", "compare": "【选鱼】5-8斤重野生鳙鱼头<br>【水源】天目湖水文火久煨<br>【特点】汤白如乳，鲜而不腥"}, {"name": "溧阳扎肝", "tags": ["溧阳三宝", "非遗"], "brief": "食材丰富，香味浓郁", "desc": "扎肝是溧阳传统美食，用小肠把猪肝、五花肉、油豆腐、笋干紧紧捆扎，浓油赤酱地慢炖。", "story": "扎肝是溧阳'三宝'之一（肉圆、酱剥子、扎肝），相传源于明代。当地人办喜事时必备此菜，取'官运亨通、事业发达'的吉祥寓意。《舌尖上的中国》第二季曾专门介绍过这道美食。", "shop": "溧阳各大菜馆（推荐：溧阳市南大街98号）", "compare": "【工艺】小肠把猪肝、五花肉、油豆腐、笋干捆扎<br>【炖煮】浓油赤酱慢炖<br>【寓意】官运亨通、事业发达"}, {"name": "雁来蕈豆腐煲", "tags": ["时令山珍", "秋季限定"], "brief": "野生菌菇，鲜香四溢", "desc": "雁来蕈是深秋野生菌，只在每年大雁南飞时产于茅山地区。配豆腐慢炖，鲜香无比。", "story": "雁来蕈生长于深秋大雁归来之际，盛产于溧阳北部瓦屋山区。相传乾隆皇帝下江南时曾在茅山品尝此菜，赞其'山珍之冠'。雁来蕈无法人工培育，采摘期仅两周左右，极为珍贵。", "shop": "瓦屋山农家乐（常州市溧阳市竹箦镇瓦屋山风景区）", "compare": "【食材】深秋野生菌，大雁归来时产<br>【产地】茅山地区<br>【特点】无法人工培育，采摘期仅两周"}], "代表面食": [{"name": "银丝面", "tags": ["常州代表面食", "非遗"], "brief": "面细如银丝，汤鲜面滑", "desc": "银丝面是常州百年传统面食，面条细如银丝、色白似雪。关键在于用食碱和鸡蛋清和面，配上鸡清汤。面条在沸水中翻滚15秒即捞出，根根分明、丝丝缕缕。", "story": "常州银丝面创始于清代，乾隆皇帝南巡时曾品尝此面，赞不绝口。面粉中加入鸡蛋清和食用碱，经过反复揉搓和擀压，形成独特的爽滑口感。著名数学家华罗庚曾赋诗赞美：'银丝一根面，故乡万缕情'。中国小吃谱收录此为经典。", "shop": "常州银丝面馆（常州市天宁区麻巷公寓1号甲单元102室，天宁寺南大门斜对面）", "compare": "【细度】面细如银丝，色白似雪<br>【和面】食碱和鸡蛋清和面<br>【火候】沸水翻滚15秒即捞出"}]}}, "suzhou": {"name": "苏州", "icon": "🏮", "desc": "苏式风味，精致典雅", "districts": {"姑苏区": [{"name": "松鼠桂鱼", "tags": ["苏帮菜代表作", "必吃"], "brief": "外酥里嫩，酸甜可口", "desc": "松鼠桂鱼是苏帮菜的代表作，选用鳜鱼花刀炸制后淋上糖醋汁，形似松鼠，外酥里嫩。", "story": "松鼠桂鱼源于乾隆下江南的典故。相传乾隆皇帝在松鹤楼品尝鳜鱼时，厨师为了讨彩头，将鱼身切成松鼠状，淋上糖醋汁。乾隆大悦，赐名'松鼠桂鱼'。如今已是苏帮菜的代表，逢年过节必备。", "shop": "松鹤楼（苏州市姑苏区太监弄72号，近观前街）", "compare": "【选料】鲜活太湖鳜鱼，重量约750克最佳<br>【刀工】鱼肉剞菱形花刀，深至鱼皮但不切断<br>【酱汁】传统以冰糖、镇江香醋调制"}, {"name": "响油鳝糊", "tags": ["苏帮名菜"], "brief": "滚油浇鳝，滋滋作响", "desc": "响油鳝糊选用鳝鱼丝烹制，上桌时浇上滚烫的热油，滋滋作响，故名'响油'。", "story": "响油鳝糊是苏州宴席上的经典菜肴，体现了苏帮菜讲究火候的特点。相传此菜源于清代，相传乾隆皇帝在苏州品尝后赞不绝口。制作时需将滚油浇在鳝丝上，瞬间激发葱姜蒜的香气。", "shop": "得月楼（苏州市姑苏区临顿路182号，近观前街）", "compare": "【选料】选用鳝鱼丝烹制<br>【工艺】滚油浇鳝，滋滋作响<br>【特点】蒜香浓郁，滑嫩入味"}, {"name": "苏式糕团", "tags": ["苏州名点"], "brief": "做工精细，色彩绚丽", "desc": "苏式糕团是苏州传统点心，选用糯米粉和粳米粉配合，染上天然色素，制成各种形状和颜色。", "story": "苏州糕团源于宋代，已有千年历史。苏州人讲究'不时不食'，每个节气都有对应的糕团：新年吃年糕、清明吃青团、端午吃粽子、中秋吃月饼等。糕团不仅是美食，更是苏州人生活仪式感的体现。", "shop": "万福兴（苏州市姑苏区东中市12号）", "compare": "【原料】糯米粳米按季节调配<br>【染色】天然植物汁液染色<br>【讲究】不时不食，每个节气对应不同糕团"}], "吴中区": [{"name": "东山白切羊肉", "tags": ["东山特产", "冬季美食"], "brief": "皮白肉嫩，酥而不烂", "desc": "东山白切羊肉选用东山地区放养的山羊，用传统白切工艺制作，保持羊肉原味。", "story": "东山镇是苏州著名的羊肉产地，每年入秋后，当地人会吃羊肉进补。东山白切羊肉选用东山特有的湖羊，肉质细嫩，无腥膻味。配上本店特制的椒盐，是苏州人冬日里的温暖记忆。", "shop": "东山白切羊肉老店（苏州市吴中区东山镇莫厘路98号）", "compare": "【羊种】东山特有的湖羊<br>【特点】肉质细嫩，无腥膻味<br>【吃法】配椒盐，冬日进补"}], "相城区": [{"name": "阳澄湖大闸蟹", "tags": ["地理标志", "时令"], "brief": "青壳白肚，金爪黄毛", "desc": "阳澄湖大闸蟹是江苏著名特产，蟹黄饱满，蟹膏肥美，被誉为'蟹中之王'。", "story": "阳澄湖大闸蟹养殖历史超过两千年。相传古代有一位考生在阳澄湖畔苦读，螃蟹成全了他的学业，因此螃蟹被赋予'解元'的谐音，成为科举时代的吉祥物。真正品蟹的最佳时间是农历九月团脐十月尖（雌蟹黄满雄蟹膏肥）。", "shop": "阳澄湖旅游度假区各蟹庄（苏州市相城区阳澄湖生态休闲旅游度假区）", "compare": "【标志】青壳白肚、金爪黄毛<br>【水质】阳澄湖水质清澈偏碱性<br>【文化】鲁迅称巴解为第一食蟹者"}], "昆山市": [{"name": "奥灶面", "tags": ["昆山代表", "非遗"], "brief": "红油白汤，浇头丰富", "desc": "奥灶面是昆山的招牌面食，汤底分为红油和白汤两种，配上各种浇头。", "story": "奥灶面源于清咸丰年间，相传有一女子陈秀英在昆山半山桥开了一家小面馆，因面容丑陋被称为'奥灶'（昆山方言，意为丑陋）。但她做的面鲜美无比，后被称为'奥灶面'。2013年被评为中国十大面条之一。汤底用青鱼鳞、鱼鳃、螺蛳等熬制，鲜美无比。", "shop": "奥面馆（苏州市昆山市人民路96号，半山桥旁）", "compare": "【汤底】青鱼鳞、鱼鳃、螺蛳等熬制<br>【红油】秘制红油是灵魂<br>【浇头】爆鱼用青鱼"}], "常熟市": [{"name": "常熟蒸菜 // ==================== 渲染函数 ====================
function renderFoodData() {
    const container = document.getElementById('food-content');
    container.innerHTML = '';
    
    Object.entries(foodData).forEach(([cityKey, cityData]) => {
        const citySection = document.createElement('section');
        citySection.className = `city-section city-${cityKey}`;
        citySection.setAttribute('data-city', cityKey);
        
        // 城市头部
        const header = document.createElement('div');
        header.className = 'city-header';
        header.innerHTML = `
            <span class="city-icon">${cityData.icon}</span>
            <div>
                <h2>${cityData.name}</h2>
                <div class="city-desc">${cityData.desc}</div>
            </div>
        `;
        citySection.appendChild(header);
        
        // 遍历各区县
        Object.entries(cityData.districts).forEach(([districtName, foods]) => {
            // 跳过空数组
            if (!foods || foods.length === 0) return;
            
            const districtDiv = document.createElement('div');
            districtDiv.className = 'district-section';
            
            // 检查是否是美食对比
            const isCompareSection = districtName === "美食对比";
            
            if (isCompareSection) {
                // 美食对比部分
                const compareTitle = document.createElement('div');
                compareTitle.className = 'district-title';
                compareTitle.textContent = '📚 美食对比';
                districtDiv.appendChild(compareTitle);
                
                foods.forEach((food) => {
                    const compareBox = document.createElement('div');
                    compareBox.className = 'compare-box';
                    
                    const title = document.createElement('div');
                    title.className = 'compare-title';
                    title.textContent = `🍽️ ${food.name}`;
                    compareBox.appendChild(title);
                    
                    const content = document.createElement('div');
                    content.className = 'compare-content';
                    content.innerHTML = food.desc.replace(/<br>/g, '<br>').replace(/【([^】]+)】/g, '<strong>$1</strong>：');
                    compareBox.appendChild(content);
                    
                    districtDiv.appendChild(compareBox);
                });
            } else {
                // 正常区县
                const districtTitle = document.createElement('div');
                districtTitle.className = 'district-title';
                districtTitle.textContent = districtName;
                districtDiv.appendChild(districtTitle);
                
                const foodGrid = document.createElement('div');
                foodGrid.className = 'food-grid';
                
                foods.forEach((food, index) => {
                    const card = document.createElement('div');
                    card.className = 'food-card';
                    card.style.animationDelay = `${index * 0.1}s`;
                    card.onclick = () => openModal(food, cityData.name, districtName);
                    
                    const tags = food.tags.slice(0, 2).map(tag => 
                        `<span class="food-tag">${tag}</span>`
                    ).join('');
                    
                    // 构建卡片内容
                    let cardHTML = '';
                    
                    // 如果有图片，添加图片
                    if (food.image) {
                        cardHTML += `<img class="food-card-image" src="${food.image}" alt="${food.name}" loading="lazy">`;
                    }
                    
                    cardHTML += `
                        <div class="food-card-header">
                            <div class="food-name">${food.name}</div>
                            <div class="food-tags">${tags}</div>
                        </div>
                        <div class="food-card-body">
                            <div class="food-brief">${food.brief}</div>
                            <div class="food-footer">
                                <span class="food-detail-btn">查看详情</span>
                            </div>
                        </div>
                    `;
                    
                    card.innerHTML = cardHTML;
                    
                    foodGrid.appendChild(card);
                });
                
                districtDiv.appendChild(foodGrid);
            }
            
            citySection.appendChild(districtDiv);
        });
        
        container.appendChild(citySection);
    });
}

// ==================== 模态窗口 ====================
function openModal(food, cityName, districtName) {
    document.getElementById('modal-title').textContent = food.name;
    document.getElementById('modal-location').textContent = cityName + ' · ' + districtName;
    document.getElementById('modal-desc').textContent = food.desc;
    
    var storySection = document.getElementById('story-section');
    var storyContent = document.getElementById('modal-story');
    if (food.story) {
        storySection.classList.remove('hidden');
        storyContent.innerHTML = formatContent(food.story);
    } else {
        storySection.classList.add('hidden');
    }
    
    // 处理"讲究在哪"板块
    var compareSection = document.getElementById('compare-section');
    var compareContent = document.getElementById('modal-compare');
    if (food.compare) {
        compareSection.style.display = 'block';
        compareContent.innerHTML = formatContent(food.compare);
    } else {
        compareSection.style.display = 'none';
    }
    
    var shopSection = document.getElementById('shop-section');
    var shopContent = document.getElementById('modal-shop');
    if (food.shop) {
        shopSection.classList.remove('hidden');
        shopContent.innerHTML = '<strong>📍 推荐地点：</strong>' + food.shop;
    } else {
        shopSection.classList.add('hidden');
    }
    
    document.getElementById('modal').classList.add('show');
    document.body.style.overflow = 'hidden';
}

function formatContent(text) {
    if (!text) return '';
    return text.split('<br>').filter(function(t) { return t.trim(); }).map(function(t) { 
        return '<p style="margin-bottom:10px">' + t + '</p>'; 
    }).join('');
}

function closeModal() {
    document.getElementById('modal').classList.remove('show');
    document.body.style.overflow = '';
}

document.getElementById('modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
});

// ==================== 筛选功能 ====================
document.querySelectorAll('.nav-list button').forEach(btn => {
    btn.addEventListener('click', function() {
        const city = this.getAttribute('data-city');
        document.querySelectorAll('.nav-list button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        
        document.querySelectorAll('.city-section').forEach(section => {
            const sectionCity = section.getAttribute('data-city');
            if (city === 'all') {
                section.classList.remove('hidden');
            } else {
                section.classList.toggle('hidden', sectionCity !== city);
            }
        });
        
        // 滚动到对应城市内容区域
        if (city === 'all') {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
            const targetSection = document.querySelector(`.city-section[data-city="${city}"]`);
            if (targetSection) {
                const navHeight = document.querySelector('.nav-bar').offsetHeight;
                const targetTop = targetSection.getBoundingClientRect().top + window.pageYOffset - navHeight - 20;
                window.scrollTo({ top: targetTop, behavior: 'smooth' });
            }
        }
    });
});

// ==================== 初始化 ====================
(function() {
    try {
        if (typeof foodData === 'undefined') {
            throw new Error('foodData未定义');
        }
        renderFoodData();
    } catch (e) {
        console.error('网站初始化错误:', e);
        document.getElementById('food-content').innerHTML = 
            '<div style="padding:40px;text-align:center;color:#c41e3a;">' +
            '<h2>数据加载出错</h2>' +
            '<p>请刷新页面重试。如果问题持续存在，请联系管理员。</p>' +
            '</div>';
    }
})();
</script>
